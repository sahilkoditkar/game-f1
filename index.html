<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Turbo Tour – Free 3D Car Racing Game in Your Browser</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23ff5a1f'/><text x='50' y='68' font-size='52' text-anchor='middle' font-family='Arial' font-weight='bold' fill='white'>A</text></svg>" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Per-player heads-up displays -->
  <div id="hud-layer" class="hidden">
    <div class="hud" id="hud-0"></div>
    <div class="hud" id="hud-1"></div>
    <div id="hud-center"></div>
    <div id="hud-divider" class="hidden"></div>
  </div>

  <!-- Menus & overlays -->
  <div id="ui-layer">
    <div id="screen" class="screen"></div>
  </div>

  <div id="loading">
    <div class="logo">TURBO <span>TOUR</span></div>
    <div class="sub">Loading engine…</div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
