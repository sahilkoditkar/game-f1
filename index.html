<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Turbo Tour – Free 3D Car Racing Game in Your Browser</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="./assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="./assets/favicon-192.png" type="image/png" sizes="192x192" />
  <link rel="alternate icon" href="./assets/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="./site.webmanifest" />
  <meta name="theme-color" content="#ff5a1f" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Per-player heads-up displays -->
  <div id="hud-layer" class="hidden">
    <div class="hud" id="hud-0"></div>
    <div class="hud" id="hud-1"></div>
    <div id="hud-center"></div>
    <div id="hud-divider" class="hidden"></div>
  </div>

  <!-- Menus & overlays -->
  <div id="ui-layer">
    <div id="screen" class="screen"></div>
  </div>

  <div id="loading">
    <div class="logo">TURBO <span>TOUR</span></div>
    <div class="sub">Loading engine…</div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
