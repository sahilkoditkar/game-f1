<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Turbo Tour – Car Showroom</title>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d12; color: #e8ecf4; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
    #bar button { flex: none; background: #1b1f2a; color: #e8ecf4; border: 1px solid #2c3242; border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit; }
    #bar button.on { background: #ff5a1f; border-color: #ff5a1f; color: #fff; }
    #info { position: fixed; top: 14px; left: 16px; right: 16px; pointer-events: none; }
    #info h1 { margin: 0; font-size: 22px; }
    #info p { margin: 4px 0 0; max-width: 520px; color: #aab3c5; }
    #colors { position: fixed; top: 14px; right: 16px; display: flex; gap: 6px; }
    #colors i { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid #0b0d12; box-shadow: 0 0 0 1px #3a4152; }
    body.shot #bar, body.shot #info, body.shot #colors { display: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="info"><h1></h1><p></p></div>
  <div id="colors"></div>
  <div id="bar"></div>
  <script type="module">
    import * as THREE from 'three';
    import { CARS, PLAYER_COLORS } from './src/data.js';
    import { buildCarMesh } from './src/car.js';

    const q = new URLSearchParams(location.search);
    if (q.has('shot')) document.body.classList.add('shot');
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x10131a);
    scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x30343c, 1.1));
    const sun = new THREE.DirectionalLight(0xffffff, 2.4);
    sun.position.set(6, 10, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 });
    scene.add(sun);
    const rim = new THREE.DirectionalLight(0x9fc0ff, 1.0); rim.position.set(-6, 4, -6); scene.add(rim);
    const floor = new THREE.Mesh(new THREE.CircleGeometry(40, 64), new THREE.MeshStandardMaterial({ color: 0x2a2d34, roughness: 0.6, metalness: 0.1 }));
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    const pm = new THREE.PMREMGenerator(renderer);
    const env = new THREE.Scene();
    env.add(new THREE.Mesh(new THREE.SphereGeometry(30, 16, 8), new THREE.MeshBasicMaterial({ color: 0x3a4152, side: THREE.BackSide })));
    for (const [x, y, z] of [[10, 12, 6], [-8, 10, -6], [0, 14, -10], [12, 3, -8]]) { const l = new THREE.Mesh(new THREE.BoxGeometry(8, 1, 14), new THREE.MeshBasicMaterial({ color: 0xffffff })); l.position.set(x, y, z); l.lookAt(0, 0, 0); env.add(l); }
    const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 16), new THREE.MeshBasicMaterial({ color: 0x1a1c20 })); ground.rotation.x = -Math.PI / 2; ground.position.y = -1; env.add(ground);
    scene.environment = pm.fromScene(env, 0.03).texture;

    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
    let yaw = +(q.get('yaw') ?? 0.75), pitch = +(q.get('pitch') ?? 0.22), dist = +(q.get('dist') ?? 9.5);
    let carId = q.get('car') || 'super';
    let color = q.has('color') ? parseInt(q.get('color'), 16) : PLAYER_COLORS[0];
    let mesh = null;

    function show() {
      if (mesh) scene.remove(mesh);
      mesh = buildCarMesh(CARS.find(c => c.id === carId)?.shape || carId, color);
      scene.add(mesh);
      const car = CARS.find(c => c.id === carId);
      document.querySelector('#info h1').textContent = car ? car.name : carId;
      document.querySelector('#info p').textContent = car ? car.desc : '';
      document.querySelectorAll('#bar button').forEach(b => b.classList.toggle('on', b.dataset.id === carId));
    }
    const bar = document.getElementById('bar');
    for (const c of CARS) { const b = document.createElement('button'); b.textContent = c.name; b.dataset.id = c.id; b.onclick = () => { carId = c.id; show(); }; bar.appendChild(b); }
    const cols = document.getElementById('colors');
    for (const c of [...PLAYER_COLORS, 0x111111, 0x1e3a8a, 0xb91c1c, 0x9ca3af]) { const i = document.createElement('i'); i.style.background = '#' + c.toString(16).padStart(6, '0'); i.onclick = () => { color = c; show(); }; cols.appendChild(i); }
    show();

    let drag = null;
    addEventListener('pointerdown', e => { if (e.target.tagName === 'CANVAS') drag = [e.clientX, e.clientY]; });
    addEventListener('pointerup', () => drag = null);
    addEventListener('pointermove', e => { if (!drag) return; yaw -= (e.clientX - drag[0]) * 0.008; pitch = Math.max(0.02, Math.min(1.3, pitch + (e.clientY - drag[1]) * 0.006)); drag = [e.clientX, e.clientY]; });
    addEventListener('wheel', e => { dist = Math.max(4, Math.min(20, dist * (1 + e.deltaY * 0.001))); });
    function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
    addEventListener('resize', resize); resize();
    const spinning = !q.has('shot');
    let last = performance.now();
    renderer.setAnimationLoop((t) => {
      const dt = (t - last) / 1000; last = t;
      if (spinning && !drag) yaw += dt * 0.15;
      const ty = +(q.get('ty') ?? 0.55);
      camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, ty + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
      camera.lookAt(0, ty, 0);
      renderer.render(scene, camera);
    });
    // Scripted views (used for screenshots): setView({ car, color, yaw, pitch, dist, ty })
    window.setView = (v) => new Promise((res) => {
      if (v.car !== undefined && v.car !== carId || v.color !== undefined && v.color !== color) { carId = v.car ?? carId; color = v.color ?? color; show(); }
      yaw = v.yaw ?? yaw; pitch = v.pitch ?? pitch; dist = v.dist ?? dist; q.set('ty', v.ty ?? 0.55);
      requestAnimationFrame(() => requestAnimationFrame(res));
    });
    window.__ready = true;
  </script>
</body>
</html>
